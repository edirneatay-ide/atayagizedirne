<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Ata Yağız Edirne</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #000;
      --white: #fff;
      --font-display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
      --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
      --gutter: 22px;
      --sig-h: clamp(32px, 4.6vw, 58px);
    }

html, body {
      height: 100%;
      background: var(--white);
      color: var(--black);
      font-family: var(--font-display);
      overflow: hidden;
    }

    .contact-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top section ── */
    .top {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      padding: var(--gutter);
      gap: 32px;
      min-height: 0;
    }

    /* Left col */
    .top-left {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .studio-name {
      display: flex;
      align-items: flex-start;
      gap: calc(var(--sig-h) * 0.25);
      line-height: 1;
    }
    .sig-img { display: block; height: var(--sig-h); width: auto; }

    .photo-row {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 18px;
    }

    .intro-text {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      line-height: 1.75;
      color: rgba(0,0,0,0.45);
      text-align: left;
      max-width: 32ch;
    }

    /* Center col: photo + take me home centered, intro floats right of photo */
    .top-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .photo-placeholder {
      position: relative;
      width: clamp(120px, 17vw, 240px);
      aspect-ratio: 3/4;
      background: #e8e8e8;
      border: 1px solid rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .photo-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nav-home {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      white-space: nowrap;
    }
    .nav-home svg {
      width: 16px; height: 16px;
      flex-shrink: 0;
      color: var(--black);
    }
    .nav-home-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--black);
      opacity: 0.45;
      transition: opacity 0.2s;
    }
    .nav-home:hover .nav-home-label { opacity: 1; }

    /* Right col: nav links */
    .top-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      margin-top: clamp(52px, 7vw, 96px);
    }

    .top-right a {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--black);
      text-decoration: none;
      opacity: 0.45;
      transition: opacity 0.2s;
    }
    .top-right a:hover,
    .top-right a.active { opacity: 1; }

    /* ── Bottom section ── */
    .bottom {
      padding: clamp(12px, 2vw, 28px) var(--gutter) clamp(16px, 2.5vw, 32px);
    }

    .contact-big {
      display: block;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(36px, 8.4vw, 130px);
      letter-spacing: 0.01em;
      text-transform: lowercase;
      line-height: 1.05;
      text-decoration: none;
      color: var(--black);
      transition: opacity 0.2s;
      white-space: nowrap;
      text-align: right;
    }
    .contact-big:hover { opacity: 0.45; }
  
    /* phones: one column, page scrolls */
    @media (max-width: 700px) {
      :root { --gutter: 14px; }
      html, body { height: auto; overflow-y: auto; }
      .contact-page { height: auto; min-height: 100vh; }
      .top { grid-template-columns: 1fr; gap: 22px; align-items: start; align-content: start; justify-items: start; }
      .top-left { order: 1; }
      .top-right { order: 2; margin-top: 0; flex-direction: row; align-items: flex-start; gap: 18px; }
      .top-center { order: 3; }
      .contact-big { font-size: clamp(24px, 8.4vw, 60px); }
    }
  </style>
  <link rel="preload" as="image" href="images/signature-ata.png" />
  <link rel="preload" as="image" href="images/signature-yagiz-edirne.png" />
</head>
<body>

  <div class="contact-page">

    <div class="top">
      <!-- Left -->
      <div class="top-left">
        <span class="studio-name"><span id="name-ata"><img class="sig-img" src="images/signature-ata.png" width="291" height="179" alt="Ata"></span><span id="name-rest"><img class="sig-img" src="images/signature-yagiz-edirne.png" width="1022" height="179" alt="Yağız Edirne"></span></span>
      </div>

      <!-- Center: photo + intro side by side, take me home below -->
      <div class="top-center">
        <div class="photo-placeholder">
          <img src="images/ben.png" alt="Ata Yağız Edirne" />
        </div>
        <a class="nav-home" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
            <polyline points="9 21 9 12 15 12 15 21"/>
          </svg>
          <span class="nav-home-label">Take me home</span>
        </a>
      </div>


      <!-- Right: nav links -->
      <div class="top-right">
        <a href="index.html#projects">Works</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="cv.html">CV</a>
      </div>
    </div>

    <!-- Bottom big contact -->
    <div class="bottom">
      <a class="contact-big" href="mailto:edirneatay@gmail.com">edirneatay@gmail.com</a>
      <a class="contact-big" href="tel:+905319770520">+90 531 977 05 20</a>
    </div>

  </div>

  <script>
  (function () {

    /* Reverse of the slide-in: name slides back to the right before leaving */
    let leaving = false;
    document.querySelectorAll('.top-right a:not(.active), .nav-home').forEach(function (link) {
      link.addEventListener('click', function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        e.preventDefault();
        if (leaving) return;
        leaving = true;

        const href = this.href;
        const el = document.getElementById('name-rest');
        const rect = el.getBoundingClientRect();
        // the inline span's box is taller than its line (line-height:1), so take the top from the block line box
        const lineTop = el.parentElement.getBoundingClientRect().top;
        const cs = getComputedStyle(el);
        const gutter = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gutter')) || 22;
        const targetLeft = document.documentElement.clientWidth - gutter - rect.width;

        const clone = el.cloneNode(true);
        clone.removeAttribute('id');
        clone.style.cssText = [
          'position:fixed',
          'top:' + lineTop + 'px',
          'left:' + rect.left + 'px',
          'margin:0',
          'z-index:9999',
          'pointer-events:none',
          'transition:left 0.8s cubic-bezier(0.77,0,0.18,1)',
          'font-family:var(--font-display)',
          'font-weight:900',
          'font-size:' + cs.fontSize,
          'letter-spacing:' + cs.letterSpacing,
          'text-transform:uppercase',
          'line-height:1',
          'white-space:nowrap'
        ].join(';');
        document.body.appendChild(clone);
      clone.getBoundingClientRect(); // commit the start position so the transition always runs
        el.style.visibility = 'hidden';

        requestAnimationFrame(function () {
          requestAnimationFrame(function () { clone.style.left = targetLeft + 'px'; });
        });

        setTimeout(function () { window.location.href = href; }, 780);
      });
    });
  })();
  </script>
</body>
</html>
